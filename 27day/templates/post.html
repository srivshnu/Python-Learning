{% extends 'layout.html' %} 

{% block content %}
<div class="container">
  <h1>{{ name }}</h1>
  <form action="{{ url_for('post') }}" method="POST">
    <div>
      <textarea rows="20" style="width: 100%;" name="content" autofocus placeholder="Paste raw text here..."></textarea>
    </div>
    <div>
      <input type="submit" class="btn" value="Process Text" />
    </div>
  </form>
</div>
{% endblock %}
